name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-tests:
    name: Appium + Cucumber (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Tooling is split into its own steps. SDK + system image + emulator boot
      # cannot be a separate GHA step from the tests: the emulator process must
      # stay alive for Appium, so android-emulator-runner owns download→boot→script.
      - name: Install Appium (npm)
        run: |
          npm ci
          npx appium driver list --installed
          # Driver often already comes from package.json; install only if missing.
          if ! npx appium driver list --installed --json 2>/dev/null | grep -q '"uiautomator2"'; then
            npx appium driver install uiautomator2
          fi
          npx appium driver list --installed

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator (download SDK/image → boot → Cucumber)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          # AOSP image: fewer GMS first-run overlays than google_apis on cold CI boots.
          target: default
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash scripts/ci-android-tests.sh

      - name: Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: |
            target/cucumber-report.html
            target/cucumber.json
            target/screenshots/
            target-mvn-test.log
            target-preflight-ui.xml
          if-no-files-found: warn
